# nginx 가 하는 일 두 가지 (client/scripts/dev.js 가 개발 중에 하던 일과 같다)
#   1) /api/*  → api 컨테이너들에게 나눠 넘긴다   (리버스 프록시 + 로드밸런서)
#   2) 그 외   → 정적 파일(index.html, js, css)을 직접 준다
#
#   브라우저 ──▶ nginx ─┬─▶ /usr/share/nginx/html   (정적 파일)
#                       └─▶ api#1 / api#2 / api#3   (/api/*, 돌아가며)

# Docker 내장 DNS. "api" 라는 이름을 컨테이너 IP 들로 바꿔 준다.
# valid=10s: 10초마다 다시 물어서, 인스턴스를 늘리거나 재시작해 IP 가 바뀌어도 따라간다.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    # 이름 하나(api)가 여러 IP 로 풀리면 nginx 는 그 전부에 돌아가며(round-robin) 보낸다.
    # resolve: 시작할 때 한 번만 풀지 않고 위 resolver 로 계속 갱신한다 (zone 이 있어야 한다).
    zone api 64k;
    server api:8787 resolve;

    # nginx ↔ api 연결을 재사용한다. 요청마다 TCP 연결을 새로 맺지 않게.
    keepalive 16;
}

# 어느 인스턴스가 처리했는지($upstream_addr)를 로그에 남긴다.
log_format upstreamlog '$remote_addr "$request" $status '
                       'upstream=$upstream_addr ${upstream_response_time}s';

server {
    listen 80;
    server_name _;

    server_tokens off;                       # 에러 페이지에 nginx 버전을 노출하지 않는다
    access_log /var/log/nginx/access.log upstreamlog;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # ── 1) API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api;               # 경로(/api/v1/...)는 그대로 넘어간다
        proxy_http_version 1.1;
        proxy_set_header Connection "";      # keepalive 를 쓰려면 필요

        # api 입장에서 요청은 전부 nginx 에게서 온다. 진짜 손님 정보를 헤더로 전달한다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 한 인스턴스가 연결 실패/타임아웃이면 다른 인스턴스로 다시 보낸다.
        # 지금 API 는 전부 GET(조회)이라 두 번 보내도 안전하다.
        #
        # http_503 은 일부러 넣지 않는다. 우리 api 의 503 은 "이더리움 노드에 못 닿음"이라는
        # 정상적인 대답이지 인스턴스 고장이 아니다. 넣으면 nginx 가 멀쩡한 인스턴스들을
        # 고장으로 판정해 10초간 빼 버린다 (실제로 겪음: 3개 중 1개만 일하게 됐다).
        proxy_next_upstream error timeout;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    # ── 2) 정적 파일 ───────────────────────────────────────────────────────
    root /usr/share/nginx/html;

    location / {
        # 화면 전환을 # 으로 하므로 서버가 알아야 할 경로는 실제 파일뿐이다.
        try_files $uri $uri/ =404;

        # 파일 이름에 버전(해시)이 없으므로 "매번 바뀌었는지 확인 후 사용"(no-cache).
        # 안 바뀌었으면 304 로 본문 없이 끝나서 비용이 거의 없다.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
