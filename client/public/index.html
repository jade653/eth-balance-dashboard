<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETH Explorer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <a href="#/" class="brand">ETH Explorer</a>
    <span id="status" class="status">확인 중…</span>
  </header>

  <form id="search" autocomplete="off">
    <input id="q" name="q" type="search" spellcheck="false"
           placeholder="tx 해시 · 주소 · 블록 번호" aria-label="검색">
    <button type="submit">검색</button>
  </form>
  <p id="search-error" class="error" hidden></p>

  <main id="view"></main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
