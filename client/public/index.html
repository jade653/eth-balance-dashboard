<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETH Explorer</title>
  <script>
    // 저장된 테마를 화면이 그려지기 전에 적용 (늦게 하면 반대 색으로 한 번 번쩍인다)
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* 저장소를 못 쓰는 환경이면 자동 */ }
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- 상단 바: 로고 · (홈이 아닐 때) 검색창 · 메뉴 · 연결 상태 -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand" aria-label="ETH Explorer 홈">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 5 12.2 12 16l7-3.8L12 2Zm0 15.6-7-3.9L12 22l7-8.3-7 3.9Z" fill="currentColor"/>
        </svg>
        <span>ETH Explorer</span>
      </a>
      <form id="top-search" class="search search-sm" autocomplete="off" hidden>
        <input name="q" type="search" spellcheck="false" placeholder="주소 / tx 해시 / 블록 번호로 검색" aria-label="검색">
        <button type="submit" aria-label="검색">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l5.2 5.2 1.4-1.4-5.2-5.2A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" fill="currentColor"/></svg>
        </button>
      </form>
      <nav class="nav">
        <a href="#/">홈</a>
        <a href="#/blocks">블록</a>
        <a href="#/txs">트랜잭션</a>
      </nav>
      <span id="status" class="status">연결 확인 중…</span>
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
    </div>
  </header>

  <main id="view"></main>

  <footer class="footer">
    <div class="container">
      이더리움 메인넷 · 단건 조회는 노드(JSON-RPC)에 직접, 목록은 자체 인덱서(최근 24시간)에서 가져옵니다.
    </div>
  </footer>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
