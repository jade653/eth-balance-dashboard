# CI: 코드가 올라올 때마다 "테스트가 통과하는가"를 GitHub 서버에서 확인한다.
#
# 언제 도나
#   - main 에 push 될 때
#   - PR 이 열리거나 커밋이 추가될 때 (PR 화면에 체크 표시로 나온다)
#
# 무엇을 하나
#   1) test   : server / client / legacy 테스트를 패키지별로 동시에 돌린다
#   2) docker : 1 이 통과하면 이미지를 빌드해 띄우고 smoke test (nginx → api → DB, 로드밸런싱)
#   3) changes: (main push 만) 마지막 배포 이후 바뀐 이미지 판단 — client/ → web, server/ → api
#   4) release: 1·2 를 통과하면 바뀐 이미지만 GHCR 에 올린다 (서버가 받아 감)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 push 하면 이전 실행은 의미가 없으므로 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로가 가진 GitHub 토큰 권한을 "코드 읽기"로 최소화한다.
# 테스트만 돌리는 job 이 저장소에 쓸 권한을 가질 이유가 없다.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false            # 하나가 실패해도 다른 패키지 테스트는 계속
      matrix:
        package: [server, client, legacy]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    # job 옆에 Postgres 컨테이너를 하나 붙인다. server 의 DB 테스트(test/db.test.js)가 쓴다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node 설치 (.nvmrc 의 버전)
        uses: actions/setup-node@v4
        with:
          # 로컬(nvm use)과 CI 가 같은 버전을 쓰도록 버전을 한 파일에서만 관리한다.
          node-version-file: .nvmrc

      # 의존성 설치. package-lock.json 이 있는 패키지만 (지금은 server 의 pg 하나).
      # npm install 이 아니라 npm ci: lock 파일과 정확히 같은 버전만 설치하고, 다르면 실패한다.
      - name: 의존성 설치
        if: hashFiles(format('{0}/package-lock.json', matrix.package)) != ''
        run: npm ci

      - name: 테스트
        run: npm test

  # 이미지가 실제로 빌드되고, 띄웠을 때 nginx → api 연결과 로드밸런싱이 되는지 확인한다.
  # 코드 테스트가 통과해야 의미가 있으므로 test job 들이 끝난 뒤에 돈다 (needs).
  docker:
    name: docker (build + smoke)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 이미지 빌드 + 컨테이너 띄우기
        # --wait: 모든 컨테이너가 healthy 가 될 때까지 기다린다
        # RPC 를 일부러 닿지 않는 주소로 둔다. CI 가 메인넷에 요청을 쏘거나 그 상태에 좌우되지 않게.
        # (worker 는 재시도만 하고, health 는 503, 나머지 점검은 RPC 와 무관하다)
        env:
          RPC_HTTP_URL: http://127.0.0.1:1
        run: docker compose up -d --build --wait --wait-timeout 90

      - name: smoke test
        run: ./scripts/smoke.sh

      - name: 실패 시 컨테이너 로그
        if: failure()
        run: docker compose logs

      - name: 정리
        if: always()
        run: docker compose down

  # ── CD 의 "GitHub 쪽 절반" ───────────────────────────────────────────────
  # main 에 들어온 코드가 test·docker 를 통과하면 이미지를 GHCR 에 올린다. 서버는 여기서 받아 간다.
  # GitHub 은 서버를 모른다 — 서버 주소·SSH 키 같은 비밀값이 필요 없다.
  #
  # 프론트(web)와 백엔드(api)는 "바뀐 쪽만" 올린다 → 서버에서도 바뀐 쪽 컨테이너만 교체된다.
  #   client/ 만 바뀜 → web 만,  server/ 만 바뀜 → api 만,  문서·설정만 바뀜 → 이미지 없음

  # 무엇이 바뀌었나. 기준은 "직전 push" 가 아니라 "마지막으로 배포에 성공한 커밋" 이다.
  # 직전 push 를 기준으로 하면, 연달아 push 해서 앞의 CI 가 취소됐을 때(위 concurrency)
  # 그 앞 push 의 변경이 영영 배포되지 않는다.
  changes:
    name: changes (지난 배포 이후 바뀐 이미지)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read            # 지난 CI 실행 기록을 읽는 권한
    outputs:
      images: ${{ steps.diff.outputs.images }}

    steps:
      - name: 코드 가져오기 (히스토리 전체 — 기준 커밋과 비교해야 하므로)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 기준 커밋 찾기 (main 에서 마지막으로 성공한 CI = 마지막 배포)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --workflow ci.yml --branch main --event push --status success \
                  --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "기준(마지막 배포): ${sha:-없음 → 전부 배포}"

      - name: 바뀐 이미지 판단
        id: diff
        run: |
          images=$(./scripts/changed-images.sh "${{ steps.base.outputs.sha }}" "$GITHUB_SHA")
          echo "images=$images" >> "$GITHUB_OUTPUT"
          {
            echo "### 배포 대상"
            echo "- 기준: \`${{ steps.base.outputs.sha }}\` → 이번: \`$GITHUB_SHA\`"
            echo "- 이미지: \`$images\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 바뀐 이미지마다 job 하나. Actions 화면에 "release (web)" 처럼 따로 보인다.
  release:
    name: release (${{ matrix.image }})
    needs: [test, docker, changes]
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write          # GHCR 에 올릴 권한은 이 job 에만 준다
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub 이 job 마다 자동으로 주는 임시 토큰

      - name: 이미지 빌드 + 올리기 (태그 main, sha-xxxxxxx)
        env:
          NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          sha=sha-${GITHUB_SHA::7}
          dir=$([ "$NAME" = api ] && echo server || echo client)
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eth-explorer-$NAME
          # source 라벨: 이 이미지가 어느 저장소에서 왔는지 GHCR 에 알려 준다 (저장소와 연결됨)
          docker build "$dir" \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            -t "$img:main" -t "$img:$sha"
          docker push "$img:main"
          docker push "$img:$sha"
          echo "pushed $img:{main,$sha}" >> "$GITHUB_STEP_SUMMARY"
